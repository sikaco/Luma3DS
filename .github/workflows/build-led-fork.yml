name: Build LED-control Luma3DS

on:
  push:
    branches: [ master, led-control ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="$DEVKITARM/bin:/usr/local/bin:$PATH"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          # A GitHub fork does not necessarily expose the upstream release tags.
          # Luma derives VERSION_MAJOR/MINOR/BUILD from `git describe`; without
          # those tags it silently falls back to v0.0.0, which also breaks the
          # MCU-backed boot configuration after the MCU RAM is cleared (for
          # example after removing the battery). Always import official tags.
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/LumaTeam/Luma3DS.git
          git fetch --force --tags upstream '+refs/tags/v*:refs/tags/v*'

          revision="$(git describe --tags --match 'v[0-9]*' --abbrev=8)"
          version="$(printf '%s' "$revision" | sed -E 's/^v([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')"
          major="${version%%.*}"
          echo "Luma revision: $revision"
          echo "Luma version:  $version"
          test -n "$revision"
          test "$revision" != "v0.0.0-0"
          test "$major" -ge 10

          # devkitpro/devkitarm:latest already contains devkitARM + libctru.
          # Avoid dkp-pacman network refreshes here; they are unnecessary and
          # make reproducible builds depend on pkg.devkitpro.org availability.
          command -v arm-none-eabi-gcc
          test -f "$DEVKITPRO/libctru/lib/libctru.a"

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip python3-pip python3-setuptools git

          if ! command -v makerom >/dev/null 2>&1; then
            curl -fsSL \
              https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip \
              -o /tmp/makerom.zip
            rm -rf /tmp/makerom
            mkdir -p /tmp/makerom
            unzip -q /tmp/makerom.zip -d /tmp/makerom
            install -m 0755 "$(find /tmp/makerom -type f -name makerom -print -quit)" /usr/local/bin/makerom
          fi

          if ! command -v firmtool >/dev/null 2>&1; then
            python3 -m pip install --break-system-packages --no-cache-dir -U \
              git+https://github.com/TuxSH/firmtool.git
          fi

          command -v makerom
          command -v firmtool
          makerom -h >/dev/null 2>&1 || true

      - name: Apply LED-control overlay
        shell: bash
        run: |
          set -euxo pipefail
          bash fork/led-control/apply-overlay.sh

      - name: Build boot.firm
        shell: bash
        run: |
          set -euxo pipefail
          make -j"$(nproc)"
          test -s boot.firm

      - name: Hash artifact
        shell: bash
        run: sha256sum boot.firm | tee boot.firm.sha256

      - name: Upload boot.firm
        uses: actions/upload-artifact@v4
        with:
          name: Luma3DS-LED-Control-${{ github.sha }}
          path: |
            boot.firm
            boot.firm.sha256
          if-no-files-found: error
