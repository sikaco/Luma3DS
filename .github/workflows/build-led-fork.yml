name: Build LED-control Luma3DS

on:
  push:
    branches: [ master, led-control ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="$DEVKITARM/bin:$PATH"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          if ! command -v firmtool >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends python3-pip python3-setuptools git
            python3 -m pip install --break-system-packages --no-cache-dir -U \
              git+https://github.com/TuxSH/firmtool.git
          fi
          command -v arm-none-eabi-gcc
          command -v makerom
          command -v firmtool

      - name: Apply LED-control overlay
        shell: bash
        run: |
          set -euxo pipefail
          bash fork/led-control/apply-overlay.sh

      - name: Build boot.firm
        shell: bash
        run: |
          set -euxo pipefail
          make -j"$(nproc)"
          test -s boot.firm

      - name: Hash artifact
        shell: bash
        run: sha256sum boot.firm | tee boot.firm.sha256

      - name: Upload boot.firm
        uses: actions/upload-artifact@v4
        with:
          name: Luma3DS-LED-Control-${{ github.sha }}
          path: |
            boot.firm
            boot.firm.sha256
          if-no-files-found: error
